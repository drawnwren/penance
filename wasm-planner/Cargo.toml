[package]
name = "penance-wasm-planner"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Deterministic evaluation-time planner for penance"

[lib]
name = "penance_wasm_planner"
path = "src/lib.rs"
crate-type = ["lib", "cdylib"]

[[bin]]
name = "normalize-project"
path = "src/main.rs"

[dependencies]
blake3 = "1.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

[dev-dependencies]
pretty_assertions = "1"
